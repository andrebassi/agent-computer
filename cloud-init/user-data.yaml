#cloud-config
# ============================================================================
# ESTE ARQUIVO E ASCII PURO, DE PROPOSITO. NAO REINTRODUZIR ACENTOS.
#
# Medido em 29/08/2026: o DigitalOcean corrompe user_data com bytes nao-ASCII
# por dupla codificacao UTF-8, no caminho API -> ConfigDrive. Um "acessivel"
# sai daqui como C3 AD e chega no droplet como C3 83 C2 AD. O byte C2 80 que
# o travessao duplo-codificado gera e um caractere de controle C1, e o
# cloud-init RECUSA o arquivo inteiro por causa dele.
#
# A recusa e silenciosa: o droplet reporta "status: done", nao instala nada, e
# o motivo fica so nos recoverable_errors, que saem no stderr.
#
# Testado e reproduzido em: doctl 1.145.0, doctl 1.167.0, e chamada direta a
# API REST com jq (payload provado byte-identico na origem). Os tres corrompem
# igual, entao a causa NAO e o cliente.
#
# A documentacao com acentuacao correta, em portugues, esta no README.md.
# ============================================================================
# Provisionamento do agent computer: desktop virtual persistente com navegador,
# shell e workspace, acessivel por tunel SSH (nenhuma porta grafica exposta).
# Espelha o modelo do Grok Bot Computer: tela por agente, sessao de browser que
# sobrevive ao desligamento da maquina local, e handoff humano pela mesma tela.

package_update: true
package_upgrade: false

packages:
  # Servidor X virtual e gerenciador de janelas minimo -- sem ambiente desktop
  # completo, que so consumiria RAM que o Chrome vai querer.
  - xvfb
  - x11vnc
  - openbox
  - novnc
  - websockify
  - xdotool          # automacao de teclado/mouse no X, util ao agente
  - scrot            # captura de tela por linha de comando
  - x11-utils
  # Fontes: sem elas, site real renderiza com caixas no lugar do texto.
  - fonts-liberation
  - fonts-noto
  - fonts-noto-color-emoji
  - fonts-dejavu-core
  # Ferramentas de trabalho
  - git
  - curl
  - jq
  - tmux
  - htop
  - unzip
  - ca-certificates
  - gnupg

users:
  - name: agent
    groups: [sudo]
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    # Sem ssh_authorized_keys aqui de proposito: lista vazia reprova no schema
    # do cloud-init ("[] is too short"). A chave e copiada de /root/.ssh pelo
    # runcmd, ja que o DigitalOcean a injeta em root no momento da criacao.

write_files:
  # --- Servidor X virtual -----------------------------------------------
  # Resolucao fixa em 1920x1080: o mesmo canvas dos decks do dono, e evita
  # depender de redimensionamento dinamico (que o x11vnc nao entrega bem).
  - path: /etc/systemd/system/xvfb@.service
    content: |
      [Unit]
      Description=Servidor X virtual - tela %i
      After=network.target

      [Service]
      User=agent
      ExecStart=/usr/bin/Xvfb :%i -screen 0 1920x1080x24 -ac -nolisten tcp
      Restart=always
      RestartSec=2

      [Install]
      WantedBy=multi-user.target

  # --- Gerenciador de janelas -------------------------------------------
  - path: /etc/systemd/system/openbox@.service
    content: |
      [Unit]
      Description=Gerenciador de janelas Openbox - tela %i
      After=xvfb@%i.service
      Requires=xvfb@%i.service

      [Service]
      User=agent
      Environment=DISPLAY=:%i
      ExecStart=/usr/bin/openbox --sm-disable
      Restart=always
      RestartSec=2

      [Install]
      WantedBy=multi-user.target

  # --- Servidor VNC ------------------------------------------------------
  # -localhost e a trava de seguranca: o VNC nao escuta na interface publica.
  # Quem chega precisa antes ter passado pelo SSH (mesma chave da conta DO).
  - path: /etc/systemd/system/x11vnc@.service
    content: |
      [Unit]
      Description=Servidor VNC - tela %i
      After=openbox@%i.service
      Requires=xvfb@%i.service

      [Service]
      User=agent
      Environment=DISPLAY=:%i
      ExecStart=/bin/bash -c '/usr/bin/x11vnc -display :%i -localhost -nopw -forever -shared -rfbport $((5900 + %i)) -noxdamage'
      Restart=always
      RestartSec=2

      [Install]
      WantedBy=multi-user.target

  # --- Ponte VNC para o navegador ---------------------------------------
  # noVNC serve a tela como pagina web; tambem so em 127.0.0.1, alcancavel
  # apenas pelo tunel SSH aberto pelo operador.
  - path: /etc/systemd/system/novnc@.service
    content: |
      [Unit]
      Description=noVNC - tela %i
      After=x11vnc@%i.service
      Requires=x11vnc@%i.service

      [Service]
      User=agent
      ExecStart=/bin/bash -c '/usr/bin/websockify --web=/usr/share/novnc 127.0.0.1:$((6080 + %i)) 127.0.0.1:$((5900 + %i))'
      Restart=always
      RestartSec=2

      [Install]
      WantedBy=multi-user.target

  # --- Navegador persistente --------------------------------------------
  # O perfil mora em /workspace, que e o que da a "sessao que sobrevive":
  # cookies, logins e abas continuam apos reboot, rebuild ou restore.
  # A porta de depuracao 9222 fica em localhost para o agente dirigir o
  # navegador por CDP sem expor controle remoto na rede.
  - path: /etc/systemd/system/chrome@.service
    content: |
      [Unit]
      Description=Google Chrome persistente - tela %i
      After=openbox@%i.service
      Requires=xvfb@%i.service

      [Service]
      User=agent
      Environment=DISPLAY=:%i
      ExecStart=/usr/bin/google-chrome-stable \
        --user-data-dir=/workspace/browser/screen-%i \
        --remote-debugging-port=922%i \
        --remote-debugging-address=127.0.0.1 \
        --window-position=0,0 \
        --window-size=1920,1080 \
        --start-maximized \
        --no-first-run \
        --no-default-browser-check \
        --disable-session-crashed-bubble \
        --disable-features=Translate,MediaRouter \
        --password-store=basic
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

  # --- Diagnostico de dentro da maquina ---------------------------------
  - path: /usr/local/bin/screen-add
    permissions: '0755'
    content: |
      #!/bin/bash
      # Cria mais uma tela na MESMA maquina, no modelo da doc: um computador
      # por conta, uma tela por agente. As telas sao superficies de trabalho
      # separadas, NAO fronteiras de seguranca -- quem alcanca uma alcanca o
      # mesmo /workspace e as mesmas credenciais de linha de comando.
      # Uso: screen-add 2
      set -euo pipefail
      N="${1:?uso: screen-add <numero da tela, 2..9>}"
      [[ "$N" =~ ^[2-9]$ ]] || { echo "tela deve ser de 2 a 9 (a 1 sobe no boot)"; exit 1; }

      # SEMEADURA DE SESSAO.
      #
      # A documentacao diz que logar num site por um agente deixa a sessao
      # disponivel para os outros. O Chrome nao permite dois processos no mesmo
      # user-data-dir -- ha um SingletonLock -- entao a sessao nao pode ser
      # literalmente compartilhada. O que da e SEMEAR: a tela nova nasce com uma
      # copia do perfil da tela 1.
      #
      # Isto funciona porque o Chrome sobe com --password-store=basic, e nesse
      # modo os cookies sao cifrados com chave fixa, nao com o chaveiro do
      # usuario. Com o chaveiro, a copia produziria um perfil cujos cookies nao
      # descriptografam, e o sintoma seria "deslogado" sem erro nenhum.
      #
      # LIMITE, e ele e real: login feito na tela 1 DEPOIS de a tela N existir
      # nao se propaga sozinho. Para isso ha o session-sync.
      SEMENTE=/workspace/browser/screen-1
      DESTINO="/workspace/browser/screen-$N"
      if [ ! -d "$DESTINO" ] && [ -d "$SEMENTE" ]; then
        echo "semeando a tela $N com a sessao da tela 1"
        mkdir -p "$DESTINO"
        # --reflink=auto usa copia por referencia quando o sistema de arquivos
        # suporta; num perfil de centenas de megabytes isso e a diferenca entre
        # instantaneo e meio minuto.
        cp -a --reflink=auto "$SEMENTE/." "$DESTINO/" 2>/dev/null || cp -a "$SEMENTE/." "$DESTINO/"
        # As travas do processo de origem nao podem viajar junto: elas apontam
        # para um PID que nao e o do Chrome novo, e o Chrome recusa subir.
        rm -f "$DESTINO"/Singleton* "$DESTINO"/*.lock 2>/dev/null || true
        chown -R agent:agent "$DESTINO"
      fi

      sudo systemctl enable --now "xvfb@$N" "openbox@$N" "x11vnc@$N" "novnc@$N" "chrome@$N"
      sleep 3
      echo "tela $N no ar:"
      echo "  VNC  127.0.0.1:$((5900 + N))"
      echo "  web  127.0.0.1:$((6080 + N))"
      echo "  CDP  127.0.0.1:922$N"

  - path: /usr/local/bin/session-sync
    permissions: '0755'
    content: |
      #!/bin/bash
      # Propaga a sessao do navegador de uma tela para outra.
      #
      # Resolve o que a semeadura do screen-add nao alcanca: um login feito na
      # tela de origem DEPOIS de a tela de destino ja existir.
      #
      # Uso: session-sync <origem> <destino>     por exemplo: session-sync 1 2
      #
      # A copia e feita com o Chrome do DESTINO parado, e nao do origem. Copiar
      # de um perfil em uso pega o SQLite de cookies a meio de uma escrita, e o
      # sintoma e um perfil que abre "deslogado" sem erro nenhum -- o pior tipo
      # de falha, porque parece que a sessao expirou.
      #
      # Mesmo assim o resultado nao e atomico: se alguem estiver navegando na
      # origem durante a copia, a foto sai de instantes diferentes. Para sessao
      # de login isso basta, porque o cookie ja estava gravado antes.
      set -euo pipefail
      FROM="${1:?uso: session-sync <tela de origem> <tela de destino>}"
      TO="${2:?uso: session-sync <tela de origem> <tela de destino>}"
      [[ "$FROM" =~ ^[1-9]$ && "$TO" =~ ^[1-9]$ ]] || { echo "telas de 1 a 9"; exit 1; }
      [ "$FROM" = "$TO" ] && { echo "origem e destino sao a mesma tela"; exit 1; }

      SRC="/workspace/browser/screen-$FROM"
      DST="/workspace/browser/screen-$TO"
      [ -d "$SRC" ] || { echo "a tela $FROM nao tem perfil em $SRC"; exit 1; }

      echo "parando o navegador da tela $TO"
      sudo systemctl stop "chrome@$TO" 2>/dev/null || true
      sleep 2

      echo "copiando a sessao da tela $FROM para a tela $TO"
      # O historico do destino e preservado de proposito: o que se quer propagar
      # e a SESSAO (cookies, logins, tokens), nao o que o outro agente visitou.
      rm -rf "$DST.anterior"
      [ -d "$DST" ] && mv "$DST" "$DST.anterior"
      mkdir -p "$DST"
      cp -a --reflink=auto "$SRC/." "$DST/" 2>/dev/null || cp -a "$SRC/." "$DST/"
      rm -f "$DST"/Singleton* "$DST"/*.lock 2>/dev/null || true
      sudo chown -R agent:agent "$DST"

      echo "religando o navegador da tela $TO"
      sudo systemctl start "chrome@$TO"
      sleep 3
      if [ "$(systemctl is-active "chrome@$TO")" = "active" ]; then
        echo "OK. O perfil anterior ficou em $DST.anterior -- apague quando conferir."
      else
        echo "FALHOU ao religar. Restaurando o perfil anterior."
        rm -rf "$DST"
        mv "$DST.anterior" "$DST"
        sudo systemctl start "chrome@$TO"
        exit 1
      fi

  - path: /usr/local/bin/screen-remove
    permissions: '0755'
    content: |
      #!/bin/bash
      # Derruba uma tela. O perfil do navegador dela CONTINUA em
      # /workspace/browser/screen-N: derrubar a tela nao apaga a sessao,
      # justamente para que ela volte igual em `screen-add`.
      set -euo pipefail
      N="${1:?uso: screen-remove <numero da tela, 2..9>}"
      [[ "$N" =~ ^[2-9]$ ]] || { echo "a tela 1 nao se remove"; exit 1; }
      sudo systemctl disable --now "chrome@$N" "novnc@$N" "x11vnc@$N" "openbox@$N" "xvfb@$N"
      echo "tela $N removida (perfil preservado em /workspace/browser/screen-$N)"

  - path: /usr/local/bin/agent-status
    permissions: '0755'
    content: |
      #!/bin/bash
      # Estado das telas ativas, do estado duravel e dos recursos.
      echo "=== telas ==="
      for n in $(seq 1 9); do
        st="$(systemctl is-active xvfb@$n.service 2>/dev/null)"
        [ "$st" != "active" ] && continue
        printf "  tela %s: " "$n"
        for unit in openbox x11vnc novnc chrome; do
          printf "%s=%s " "$unit" "$(systemctl is-active ${unit}@$n.service)"
        done
        printf "| web 127.0.0.1:%s CDP 127.0.0.1:922%s\n" "$((6080 + n))" "$n"
      done
      echo
      echo "=== estado duravel ==="
      printf "  volume: %s\n" "$(cat /var/lib/agent-computer-volume 2>/dev/null || echo DESCONHECIDO)"
      if mountpoint -q /workspace; then
        echo "  /workspace: volume separado (sobrevive a rebuild do droplet)"
      else
        echo "  /workspace: NO DISCO DO DROPLET -- some se o droplet for recriado"
      fi
      df -h /workspace 2>/dev/null | tail -1 | sed "s/^/  /"
      echo "  /scratch: descartavel, $(du -sh /scratch 2>/dev/null | cut -f1)"
      echo
      echo "=== portas ouvindo ==="
      ss -lntp 2>/dev/null | grep -E ':(59[0-9][0-9]|60[0-9][0-9]|922[0-9])' || echo "  nenhuma"
      echo
      echo "=== recursos ==="
      free -h | sed "s/^/  /"
      df -h / | tail -1 | sed "s/^/  /"

runcmd:
  # Swap: rede de seguranca contra OOM do Chrome, que e o processo mais
  # faminto da maquina. 2 GB sobre os 4 GB de RAM.
  - [ bash, -c, "fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab" ]
  - [ bash, -c, "sysctl -w vm.swappiness=10 && echo 'vm.swappiness=10' > /etc/sysctl.d/99-swappiness.conf" ]

  # A chave SSH foi injetada em root pelo doctl; replicar para o usuario agent.
  - [ bash, -c, "install -d -m 700 -o agent -g agent /home/agent/.ssh && cp /root/.ssh/authorized_keys /home/agent/.ssh/authorized_keys && chown agent:agent /home/agent/.ssh/authorized_keys && chmod 600 /home/agent/.ssh/authorized_keys" ]

  # ESTADO DURAVEL: volume de bloco separado, montado em /workspace.
  #
  # E o que torna "Update" possivel no sentido da doc: trocar a imagem do
  # computador preservando o estado duravel. Com tudo no disco do droplet,
  # destruir o droplet destruiria o trabalho junto, e so restaria "Reset".
  #
  # O device demora alguns segundos a aparecer depois do attach; sem a espera,
  # o mount falha e o cloud-init segue adiante criando /workspace no disco
  # local, que e o pior desfecho possivel: tudo funciona e o estado some no
  # primeiro rebuild.
  - [ bash, -c, "for i in $(seq 1 30); do [ -e /dev/disk/by-id/scsi-0DO_Volume_agent-computer-workspace ] && break; sleep 2; done" ]
  - [ bash, -c, "if [ -e /dev/disk/by-id/scsi-0DO_Volume_agent-computer-workspace ]; then mkdir -p /workspace && (mount -o discard,defaults,noatime /dev/disk/by-id/scsi-0DO_Volume_agent-computer-workspace /workspace || { mkfs.ext4 -F /dev/disk/by-id/scsi-0DO_Volume_agent-computer-workspace && mount -o discard,defaults,noatime /dev/disk/by-id/scsi-0DO_Volume_agent-computer-workspace /workspace; }) && echo '/dev/disk/by-id/scsi-0DO_Volume_agent-computer-workspace /workspace ext4 discard,defaults,noatime,nofail 0 2' >> /etc/fstab && echo VOLUME_MONTADO > /var/lib/agent-computer-volume; else echo SEM_VOLUME > /var/lib/agent-computer-volume; fi" ]
  - [ bash, -c, "mkdir -p /workspace/browser /workspace/projects && chown -R agent:agent /workspace" ]

  # DESCARTAVEL, explicitamente. A doc separa o que sobrevive do que nao:
  # temporarios, pacote instalado na mao e estado de aplicacao nao commitado
  # sao substituiveis. Sem um lugar declarado para o efemero, todo arquivo
  # acaba no /workspace e a fronteira deixa de existir na pratica.
  - [ bash, -c, "mkdir -p /scratch && chown agent:agent /scratch && chmod 1777 /scratch" ]
  - [ bash, -c, "printf 'D /scratch 1777 agent agent -\n' > /etc/tmpfiles.d/scratch.conf" ]

  # Google Chrome do repositorio oficial (nao Chromium): melhor compatibilidade
  # com site real, que e o ponto de um agente que navega na web de verdade.
  - [ bash, -c, "curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg" ]
  - [ bash, -c, "echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main' > /etc/apt/sources.list.d/google-chrome.list" ]
  - [ bash, -c, "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq google-chrome-stable" ]

  # Node 22 + Claude Code, para o agente rodar dentro da propria maquina.
  - [ bash, -c, "curl -fsSL https://deb.nodesource.com/setup_22.x | bash -" ]
  - [ bash, -c, "DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nodejs" ]
  - [ bash, -c, "npm install -g @anthropic-ai/claude-code 2>&1 | tail -2" ]

  # Tailscale instalado mas NAO autenticado: sem authkey no cofre, o login e
  # um clique do dono. Fica pronto para quando ele quiser a maquina na malha.
  - [ bash, -c, "curl -fsSL https://tailscale.com/install.sh | sh" ]

  # Firewall: so SSH. A tela e a porta de depuracao nunca saem da maquina.
  - [ bash, -c, "ufw default deny incoming && ufw default allow outgoing && ufw allow 22/tcp && ufw --force enable" ]

  # Subir a tela.
  - [ systemctl, daemon-reload ]
  # Tela 1 sobe sempre. Telas adicionais entram sob demanda com
  # `screen-add N`, seguindo o modelo da doc: uma maquina, N telas.
  - [ bash, -c, "systemctl enable --now xvfb@1 openbox@1 x11vnc@1 novnc@1 chrome@1" ]

  # Marca de conclusao lida pelo script de espera -- sem isso nao ha como
  # distinguir "cloud-init ainda rodando" de "cloud-init falhou".
  - [ bash, -c, "echo READY > /var/lib/agent-computer-ready" ]

final_message: "agent computer pronto em $UPTIME segundos"
