#cloud-config
# ============================================================================
# ESTE ARQUIVO E ASCII PURO, DE PROPOSITO. NAO REINTRODUZIR ACENTOS.
#
# Medido em 29/08/2026: o DigitalOcean corrompe user_data com bytes nao-ASCII
# por dupla codificacao UTF-8, no caminho API -> ConfigDrive. Um "acessivel"
# sai daqui como C3 AD e chega no droplet como C3 83 C2 AD. O byte C2 80 que
# o travessao duplo-codificado gera e um caractere de controle C1, e o
# cloud-init RECUSA o arquivo inteiro por causa dele.
#
# A recusa e silenciosa: o droplet reporta "status: done", nao instala nada, e
# o motivo fica so nos recoverable_errors, que saem no stderr.
#
# Testado e reproduzido em: doctl 1.145.0, doctl 1.167.0, e chamada direta a
# API REST com jq (payload provado byte-identico na origem). Os tres corrompem
# igual, entao a causa NAO e o cliente.
#
# A documentacao com acentuacao correta, em portugues, esta no README.md.
# ============================================================================
# Provisionamento do agent computer: desktop virtual persistente com navegador,
# shell e workspace, acessivel por tunel SSH (nenhuma porta grafica exposta).
# Espelha o modelo do Grok Bot Computer: tela por agente, sessao de browser que
# sobrevive ao desligamento da maquina local, e handoff humano pela mesma tela.

package_update: true
package_upgrade: false

packages:
  # Servidor X virtual e gerenciador de janelas minimo -- sem ambiente desktop
  # completo, que so consumiria RAM que o Chrome vai querer.
  - xvfb
  - x11vnc
  - openbox
  - novnc
  - websockify
  - xdotool          # automacao de teclado/mouse no X, util ao agente
  - scrot            # captura de tela por linha de comando
  - x11-utils
  # Fontes: sem elas, site real renderiza com caixas no lugar do texto.
  - fonts-liberation
  - fonts-noto
  - fonts-noto-color-emoji
  - fonts-dejavu-core
  # Ferramentas de trabalho
  - git
  - curl
  - jq
  - tmux
  - htop
  - unzip
  - ca-certificates
  - gnupg

users:
  # agentd e o DONO DO COFRE e quem roda o servico. Sem shell e sem sudo: ele
  # nao precisa de nenhum privilegio proprio, so de ser um usuario diferente.
  #
  # A separacao e o mecanismo inteiro da protecao dos segredos. O modelo dirige
  # a ferramenta de shell; se ela rodasse com o usuario dono da identidade age,
  # um `cat` no arquivo de senha entregaria tudo, e a cifra em repouso so
  # protegeria a foto do volume -- nao a maquina.
  - name: agentd
    system: true
    shell: /usr/sbin/nologin
    lock_passwd: true
  # agent e a conta SSH e o usuario para quem as ferramentas do modelo caem.
  #
  # PERDEU o NOPASSWD:ALL de proposito. Com ele, o modelo era root: lia o cofre,
  # o token da porta, a credencial do agente de codigo, e desfazia qualquer
  # controle deste arquivo com uma linha. O sudo agora e lista fechada, em
  # /etc/sudoers.d/agent-computer, com os comandos que a operacao usa de fato.
  - name: agent
    shell: /bin/bash
    # Sem ssh_authorized_keys aqui de proposito: lista vazia reprova no schema
    # do cloud-init ("[] is too short"). A chave e copiada de /root/.ssh pelo
    # runcmd, ja que o DigitalOcean a injeta em root no momento da criacao.

write_files:
  # --- Privilegio: lista fechada -----------------------------------------
  #
  # Substitui o `NOPASSWD:ALL` que o usuario agent tinha. Com ele, a ferramenta
  # de shell -- que o MODELO dirige -- era root: lia /etc/agentd/vault.pass,
  # lia o token da porta HTTP, e reescrevia qualquer unidade deste arquivo.
  # Nenhum controle de segredo sobrevive a isso.
  #
  # Duas concessoes, e so estas duas:
  #
  #   agentd -> agent   rebaixamento das ferramentas (reducao de privilegio)
  #   agent  -> root    lista fechada de comandos de operacao
  #
  # Fora da lista de proposito, porque cada um destes E root por outro caminho:
  #   apt-get     script de mantenedor roda como root
  #   chown/chmod muda o dono do proprio arquivo de senha do cofre
  #   systemctl edit/link/set-property   injeta ExecStart arbitrario
  #   journalctl sem unidade fixa        le log de qualquer servico
  #   dd, tee, cp, cat, bash, su, sh     leitura ou escrita arbitraria
  - path: /etc/sudoers.d/agent-computer
    permissions: '0440'
    owner: root:root
    content: |
      # Rebaixamento: o servico abre mao de privilegio para rodar o que o modelo
      # pede. A direcao e sempre de reducao -- agentd tem o cofre, agent nao.
      agentd ALL=(agent) NOPASSWD: ALL
      # A credencial do agente de codigo atravessa o sudo porque e feita para
      # ser usada por ele. A chave do modelo e o token da porta NAO estao aqui:
      # esses nunca saem do binario.
      Defaults:agentd env_keep += "CLAUDE_CODE_OAUTH_TOKEN ANTHROPIC_API_KEY CLAUDE_CONFIG_DIR"
      Defaults:agentd !requiretty

      # Operacao pela conta SSH. Verbos explicitos: `systemctl` inteiro daria
      # root de volta por `edit`, `link` e `set-property`.
      Cmnd_Alias AGENT_UNITS = /usr/bin/systemctl start *, \
          /usr/bin/systemctl stop *, /usr/bin/systemctl restart *, \
          /usr/bin/systemctl enable *, /usr/bin/systemctl disable *, \
          /usr/bin/systemctl daemon-reload, /usr/bin/systemctl reboot
      Cmnd_Alias AGENT_DIAG = /usr/bin/systemctl status *, \
          /usr/bin/systemctl is-active *, /usr/bin/systemctl list-timers *, \
          /usr/bin/cloud-init status, /usr/bin/cloud-init status --long, \
          /usr/sbin/ufw status, /usr/bin/mount -a, \
          /usr/bin/journalctl -u agentd-api.service *, \
          /usr/bin/journalctl -u agentd-notify.service *
      # pkill preso ao agentd: sem o padrao fixo, `pkill sshd` derruba o acesso.
      Cmnd_Alias AGENT_KILL = /usr/bin/pkill -9 -f agentd*
      agent ALL=(root) NOPASSWD: AGENT_UNITS, AGENT_DIAG, AGENT_KILL

      # NAO EXISTE concessao de `agent` para `agentd` aqui, e a ausencia e
      # deliberada.
      #
      # Tentei dar ao operador `agent ALL=(agentd) /usr/local/bin/agentd
      # -catalog *`. Parece inofensivo e nao e: o OPERADOR e o MODELO sao o mesmo
      # usuario `agent`. Toda regra dada ao operador e dada ao modelo junto -- e
      # essa desfazia a protecao que impede o modelo de cadastrar conector
      # apontando para onde quiser.
      #
      # A autoridade do operador passa a ser a CHAVE SSH DE ROOT, que existe so
      # no Mac e que o modelo nao alcanca por caminho nenhum. Catalogo, cofre e
      # deploy entram por ali.

  # --- Servidor X virtual -----------------------------------------------
  # Resolucao fixa em 1920x1080: o mesmo canvas dos decks do dono, e evita
  # depender de redimensionamento dinamico (que o x11vnc nao entrega bem).
  - path: /etc/systemd/system/xvfb@.service
    content: |
      [Unit]
      Description=Servidor X virtual - tela %i
      After=network.target

      [Service]
      User=agent
      ExecStart=/usr/bin/Xvfb :%i -screen 0 1920x1080x24 -ac -nolisten tcp
      Restart=always
      RestartSec=2

      [Install]
      WantedBy=multi-user.target

  # --- Gerenciador de janelas -------------------------------------------
  - path: /etc/systemd/system/openbox@.service
    content: |
      [Unit]
      Description=Gerenciador de janelas Openbox - tela %i
      After=xvfb@%i.service
      Requires=xvfb@%i.service

      [Service]
      User=agent
      Environment=DISPLAY=:%i
      ExecStart=/usr/bin/openbox --sm-disable
      Restart=always
      RestartSec=2

      [Install]
      WantedBy=multi-user.target

  # --- Servidor VNC ------------------------------------------------------
  # -localhost e a trava de seguranca: o VNC nao escuta na interface publica.
  # Quem chega precisa antes ter passado pelo SSH (mesma chave da conta DO).
  - path: /etc/systemd/system/x11vnc@.service
    content: |
      [Unit]
      Description=Servidor VNC - tela %i
      After=openbox@%i.service
      Requires=xvfb@%i.service

      [Service]
      User=agent
      Environment=DISPLAY=:%i
      ExecStart=/bin/bash -c '/usr/bin/x11vnc -display :%i -localhost -nopw -forever -shared -rfbport $((5900 + %i)) -noxdamage'
      Restart=always
      RestartSec=2

      [Install]
      WantedBy=multi-user.target

  # --- Ponte VNC para o navegador ---------------------------------------
  # noVNC serve a tela como pagina web; tambem so em 127.0.0.1, alcancavel
  # apenas pelo tunel SSH aberto pelo operador.
  - path: /etc/systemd/system/novnc@.service
    content: |
      [Unit]
      Description=noVNC - tela %i
      After=x11vnc@%i.service
      Requires=x11vnc@%i.service

      [Service]
      User=agent
      ExecStart=/bin/bash -c '/usr/bin/websockify --web=/usr/share/novnc 127.0.0.1:$((6080 + %i)) 127.0.0.1:$((5900 + %i))'
      Restart=always
      RestartSec=2

      [Install]
      WantedBy=multi-user.target

  # --- Navegador persistente --------------------------------------------
  # O perfil mora em /workspace, que e o que da a "sessao que sobrevive":
  # cookies, logins e abas continuam apos reboot, rebuild ou restore.
  # A porta de depuracao 9222 fica em localhost para o agente dirigir o
  # navegador por CDP sem expor controle remoto na rede.
  - path: /etc/systemd/system/chrome@.service
    content: |
      [Unit]
      Description=Google Chrome persistente - tela %i
      After=openbox@%i.service
      Requires=xvfb@%i.service

      [Service]
      User=agent
      Environment=DISPLAY=:%i
      ExecStart=/usr/bin/google-chrome-stable \
        --user-data-dir=/workspace/browser/screen-%i \
        --remote-debugging-port=922%i \
        --remote-debugging-address=127.0.0.1 \
        --window-position=0,0 \
        --window-size=1920,1080 \
        --start-maximized \
        --no-first-run \
        --no-default-browser-check \
        --disable-session-crashed-bubble \
        --disable-features=Translate,MediaRouter \
        --password-store=basic
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

  # --- Porta HTTP: outros sistemas mandam tarefa por aqui ----------------
  #
  # A unidade mora AQUI, no cloud-init, e nao escrita a mao no droplet: `task
  # update` destroi a maquina e remonta so o volume, entao uma unidade manual
  # some no primeiro update: o servico nao volta e ninguem entende por que.
  #
  # Ela nao e habilitada por padrao. A porta so sobe quando alguem rodar
  # `task serve-enable`, porque ela exige duas credenciais instaladas antes
  # (token da API e chave do modelo) e subir sem elas so produziria um servico
  # em falha reiniciando para sempre.
  - path: /etc/systemd/system/agentd-api.service
    content: |
      [Unit]
      Description=agent computer - porta HTTP de tarefas
      # O binario e o estado vivem no volume duravel. Sem isto, o systemd sobe
      # o servico antes da montagem e ele falha lendo um diretorio vazio.
      RequiresMountsFor=/workspace
      After=network-online.target
      Wants=network-online.target

      [Service]
      User=agentd
      # AGENTD_TOOL_USER e o que faz o cofre valer contra quem ja esta dentro da
      # maquina: toda ferramenta que o modelo dispara cai para este usuario, que
      # nao le a identidade age. Sem esta linha o `bash -c` do modelo rodaria
      # como agentd, dono do cofre.
      # ORDEM PROPOSITAL, e ela e a diferenca entre proteger e nao proteger.
      #
      # O systemd aplica Environment= e EnvironmentFile= NA ORDEM EM QUE APARECEM,
      # e para a mesma variavel o ULTIMO vence. Com o arquivo por ultimo, quem
      # pudesse escrever nele sobrescreveria AGENTD_TOOL_USER e desligaria o
      # proprio rebaixamento -- virando dono do cofre. O arquivo vem primeiro,
      # a linha fixa vem depois, e nenhum arquivo altera o que decide seguranca.
      #
      # E o arquivo saiu de /workspace: la o modelo escreve. Agora e 0640
      # agentd:agentd em /etc, que ele nem le. O systemd carrega como PID 1,
      # antes de baixar para User=agentd, entao o servico sobe igual.
      EnvironmentFile=-/etc/agentd/xai.env
      # AGENTD_TOOL_USER e o que faz o cofre valer contra quem ja esta dentro da
      # maquina: toda ferramenta que o modelo dispara cai para este usuario, que
      # nao le a identidade age.
      Environment=AGENTD_TOOL_USER=agent
      # 127.0.0.1 de proposito: o acesso e pelo mesmo tunel SSH que ja serve a
      # tela. Escutar em 0.0.0.0 esta a uma regra de firewall mal escrita de
      # estar na internet publica, e o modo de falha e silencioso.
      ExecStart=/usr/local/bin/agentd -serve -listen 127.0.0.1:8787
      Restart=on-failure
      RestartSec=10
      # O encerramento limpo cancela as tarefas em voo, elas gravam o estado e
      # soltam a trava. 40s da folga para isso acontecer antes do SIGKILL.
      TimeoutStopSec=40
      KillSignal=SIGTERM

      # --- Isolamento do systemd -----------------------------------------
      #
      # Vale em dobro aqui porque as ferramentas do MODELO herdam este namespace:
      # o que esta fechado para o servico esta fechado para ele tambem.
      #
      # /etc e /usr ficam so-leitura. O servico LE /etc/agentd (identidade do
      # cofre) e nao precisa escrever em lugar nenhum fora do volume.
      ProtectSystem=strict
      ReadWritePaths=/workspace /scratch
      PrivateTmp=yes
      ProtectKernelTunables=yes
      ProtectKernelModules=yes
      ProtectControlGroups=yes
      RestrictRealtime=yes
      LockPersonality=yes
      #
      # ATENCAO: NoNewPrivileges e RestrictSUIDSGID ficam DE FORA, e nao por descuido:
      # o rebaixamento das ferramentas usa `sudo`, que e setuid. Ligar os dois
      # quebraria justamente o mecanismo que tira o cofre do alcance do modelo --
      # a protecao maior perderia para a menor. Fica registrado para quem for
      # endurecer isto depois nao "consertar" o que esta assim de proposito.

      [Install]
      WantedBy=multi-user.target

  # --- Entrega dos avisos, em processo separado --------------------------
  #
  # E o que satisfaz o requisito duro da proatividade: a entrega nao depende da
  # conexao que iniciou a tarefa. Matar a sessao SSH nao mata o aviso.
  #
  # Tambem nao e habilitado por padrao: sem destino configurado nao ha o que
  # entregar, e um timer disparando a cada minuto contra nada e ruido no log.
  - path: /etc/systemd/system/agentd-notify.service
    content: |
      [Unit]
      Description=agent computer - entrega os avisos enfileirados
      RequiresMountsFor=/workspace
      After=network-online.target

      [Service]
      Type=oneshot
      User=agent
      # O destino vem de um arquivo separado, para trocar o webhook sem editar
      # a unidade. Se ele nao existir, o drenador so lista e nao consome a fila.
      EnvironmentFile=-/etc/agentd/notify.env
      # SEM shell. O destino vinha de arquivo em /workspace -- que o modelo
      # escreve -- e era interpolado entre aspas dentro de `sh -c`: um valor
      # fechando a aspa e emendando outro comando seria executado. Sem shell nao
      # ha o que injetar, e o binario le AGENT_WEBHOOK do ambiente ele mesmo.
      ExecStart=/usr/local/bin/agentd -notify-drain

  - path: /etc/systemd/system/agentd-notify.timer
    content: |
      [Unit]
      Description=agent computer - drena os avisos a cada minuto

      [Timer]
      OnBootSec=2min
      OnUnitActiveSec=1min
      # Sem isto, um drenador que demore mais que o intervalo acumularia
      # execucoes sobrepostas disputando a mesma fila.
      AccuracySec=10s

      [Install]
      WantedBy=timers.target

  # --- Diagnostico de dentro da maquina ---------------------------------
  - path: /usr/local/bin/screen-add
    permissions: '0755'
    content: |
      #!/bin/bash
      # Cria mais uma tela na MESMA maquina, no modelo da doc: um computador
      # por conta, uma tela por agente. As telas sao superficies de trabalho
      # separadas, NAO fronteiras de seguranca -- quem alcanca uma alcanca o
      # mesmo /workspace e as mesmas credenciais de linha de comando.
      # Uso: screen-add 2
      set -euo pipefail
      N="${1:?uso: screen-add <numero da tela, 2..9>}"
      [[ "$N" =~ ^[2-9]$ ]] || { echo "tela deve ser de 2 a 9 (a 1 sobe no boot)"; exit 1; }

      # SEMEADURA DE SESSAO.
      #
      # A documentacao diz que logar num site por um agente deixa a sessao
      # disponivel para os outros. O Chrome nao permite dois processos no mesmo
      # user-data-dir -- ha um SingletonLock -- entao a sessao nao pode ser
      # literalmente compartilhada. O que da e SEMEAR: a tela nova nasce com uma
      # copia do perfil da tela 1.
      #
      # Isto funciona porque o Chrome sobe com --password-store=basic, e nesse
      # modo os cookies sao cifrados com chave fixa, nao com o chaveiro do
      # usuario. Com o chaveiro, a copia produziria um perfil cujos cookies nao
      # descriptografam, e o sintoma seria "deslogado" sem erro nenhum.
      #
      # LIMITE, e ele e real: login feito na tela 1 DEPOIS de a tela N existir
      # nao se propaga sozinho. Para isso ha o session-sync.
      SEMENTE=/workspace/browser/screen-1
      DESTINO="/workspace/browser/screen-$N"
      if [ ! -d "$DESTINO" ] && [ -d "$SEMENTE" ]; then
        echo "semeando a tela $N com a sessao da tela 1"
        mkdir -p "$DESTINO"
        # --reflink=auto usa copia por referencia quando o sistema de arquivos
        # suporta; num perfil de centenas de megabytes isso e a diferenca entre
        # instantaneo e meio minuto.
        cp -a --reflink=auto "$SEMENTE/." "$DESTINO/" 2>/dev/null || cp -a "$SEMENTE/." "$DESTINO/"
        # As travas do processo de origem nao podem viajar junto: elas apontam
        # para um PID que nao e o do Chrome novo, e o Chrome recusa subir.
        rm -f "$DESTINO"/Singleton* "$DESTINO"/*.lock 2>/dev/null || true
        chown -R agent:agent "$DESTINO"
      fi

      sudo systemctl enable --now "xvfb@$N" "openbox@$N" "x11vnc@$N" "novnc@$N" "chrome@$N"
      sleep 3
      echo "tela $N no ar:"
      echo "  VNC  127.0.0.1:$((5900 + N))"
      echo "  web  127.0.0.1:$((6080 + N))"
      echo "  CDP  127.0.0.1:922$N"

  - path: /usr/local/bin/session-sync
    permissions: '0755'
    content: |
      #!/bin/bash
      # Propaga a sessao do navegador de uma tela para outra.
      #
      # Resolve o que a semeadura do screen-add nao alcanca: um login feito na
      # tela de origem DEPOIS de a tela de destino ja existir.
      #
      # Uso: session-sync <origem> <destino>     por exemplo: session-sync 1 2
      #
      # A copia e feita com o Chrome do DESTINO parado, e nao do origem. Copiar
      # de um perfil em uso pega o SQLite de cookies a meio de uma escrita, e o
      # sintoma e um perfil que abre "deslogado" sem erro nenhum -- o pior tipo
      # de falha, porque parece que a sessao expirou.
      #
      # Mesmo assim o resultado nao e atomico: se alguem estiver navegando na
      # origem durante a copia, a foto sai de instantes diferentes. Para sessao
      # de login isso basta, porque o cookie ja estava gravado antes.
      set -euo pipefail
      FROM="${1:?uso: session-sync <tela de origem> <tela de destino>}"
      TO="${2:?uso: session-sync <tela de origem> <tela de destino>}"
      [[ "$FROM" =~ ^[1-9]$ && "$TO" =~ ^[1-9]$ ]] || { echo "telas de 1 a 9"; exit 1; }
      [ "$FROM" = "$TO" ] && { echo "origem e destino sao a mesma tela"; exit 1; }

      SRC="/workspace/browser/screen-$FROM"
      DST="/workspace/browser/screen-$TO"
      [ -d "$SRC" ] || { echo "a tela $FROM nao tem perfil em $SRC"; exit 1; }

      echo "parando o navegador da tela $TO"
      sudo systemctl stop "chrome@$TO" 2>/dev/null || true
      sleep 2

      echo "copiando a sessao da tela $FROM para a tela $TO"
      # O historico do destino e preservado de proposito: o que se quer propagar
      # e a SESSAO (cookies, logins, tokens), nao o que o outro agente visitou.
      rm -rf "$DST.anterior"
      [ -d "$DST" ] && mv "$DST" "$DST.anterior"
      mkdir -p "$DST"
      cp -a --reflink=auto "$SRC/." "$DST/" 2>/dev/null || cp -a "$SRC/." "$DST/"
      rm -f "$DST"/Singleton* "$DST"/*.lock 2>/dev/null || true
      sudo chown -R agent:agent "$DST"

      echo "religando o navegador da tela $TO"
      sudo systemctl start "chrome@$TO"
      sleep 3
      if [ "$(systemctl is-active "chrome@$TO")" = "active" ]; then
        echo "OK. O perfil anterior ficou em $DST.anterior -- apague quando conferir."
      else
        echo "FALHOU ao religar. Restaurando o perfil anterior."
        rm -rf "$DST"
        mv "$DST.anterior" "$DST"
        sudo systemctl start "chrome@$TO"
        exit 1
      fi

  - path: /usr/local/bin/screen-remove
    permissions: '0755'
    content: |
      #!/bin/bash
      # Derruba uma tela. O perfil do navegador dela CONTINUA em
      # /workspace/browser/screen-N: derrubar a tela nao apaga a sessao,
      # justamente para que ela volte igual em `screen-add`.
      set -euo pipefail
      N="${1:?uso: screen-remove <numero da tela, 2..9>}"
      [[ "$N" =~ ^[2-9]$ ]] || { echo "a tela 1 nao se remove"; exit 1; }
      sudo systemctl disable --now "chrome@$N" "novnc@$N" "x11vnc@$N" "openbox@$N" "xvfb@$N"
      echo "tela $N removida (perfil preservado em /workspace/browser/screen-$N)"

  - path: /usr/local/bin/agent-status
    permissions: '0755'
    content: |
      #!/bin/bash
      # Estado das telas ativas, do estado duravel e dos recursos.
      echo "=== telas ==="
      for n in $(seq 1 9); do
        st="$(systemctl is-active xvfb@$n.service 2>/dev/null)"
        [ "$st" != "active" ] && continue
        printf "  tela %s: " "$n"
        for unit in openbox x11vnc novnc chrome; do
          printf "%s=%s " "$unit" "$(systemctl is-active ${unit}@$n.service)"
        done
        printf "| web 127.0.0.1:%s CDP 127.0.0.1:922%s\n" "$((6080 + n))" "$n"
      done
      echo
      echo "=== estado duravel ==="
      printf "  volume: %s\n" "$(cat /var/lib/agent-computer-volume 2>/dev/null || echo DESCONHECIDO)"
      if mountpoint -q /workspace; then
        echo "  /workspace: volume separado (sobrevive a rebuild do droplet)"
      else
        echo "  /workspace: NO DISCO DO DROPLET -- some se o droplet for recriado"
      fi
      df -h /workspace 2>/dev/null | tail -1 | sed "s/^/  /"
      echo "  /scratch: descartavel, $(du -sh /scratch 2>/dev/null | cut -f1)"
      echo
      echo "=== portas ouvindo ==="
      ss -lntp 2>/dev/null | grep -E ':(59[0-9][0-9]|60[0-9][0-9]|922[0-9])' || echo "  nenhuma"
      echo
      echo "=== recursos ==="
      free -h | sed "s/^/  /"
      df -h / | tail -1 | sed "s/^/  /"

runcmd:
  # Swap: rede de seguranca contra OOM do Chrome, que e o processo mais
  # faminto da maquina. 2 GB sobre os 4 GB de RAM.
  - [ bash, -c, "fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab" ]
  - [ bash, -c, "sysctl -w vm.swappiness=10 && echo 'vm.swappiness=10' > /etc/sysctl.d/99-swappiness.conf" ]

  # A chave SSH foi injetada em root pelo doctl; replicar para o usuario agent.
  - [ bash, -c, "install -d -m 700 -o agent -g agent /home/agent/.ssh && cp /root/.ssh/authorized_keys /home/agent/.ssh/authorized_keys && chown agent:agent /home/agent/.ssh/authorized_keys && chmod 600 /home/agent/.ssh/authorized_keys" ]

  # ESTADO DURAVEL: volume de bloco separado, montado em /workspace.
  #
  # E o que torna "Update" possivel no sentido da doc: trocar a imagem do
  # computador preservando o estado duravel. Com tudo no disco do droplet,
  # destruir o droplet destruiria o trabalho junto, e so restaria "Reset".
  #
  # O device demora alguns segundos a aparecer depois do attach; sem a espera,
  # o mount falha e o cloud-init segue adiante criando /workspace no disco
  # local, que e o pior desfecho possivel: tudo funciona e o estado some no
  # primeiro rebuild.
  - [ bash, -c, "for i in $(seq 1 30); do [ -e /dev/disk/by-id/scsi-0DO_Volume_agent-computer-workspace ] && break; sleep 2; done" ]
  - [ bash, -c, "if [ -e /dev/disk/by-id/scsi-0DO_Volume_agent-computer-workspace ]; then mkdir -p /workspace && (mount -o discard,defaults,noatime /dev/disk/by-id/scsi-0DO_Volume_agent-computer-workspace /workspace || { mkfs.ext4 -F /dev/disk/by-id/scsi-0DO_Volume_agent-computer-workspace && mount -o discard,defaults,noatime /dev/disk/by-id/scsi-0DO_Volume_agent-computer-workspace /workspace; }) && echo '/dev/disk/by-id/scsi-0DO_Volume_agent-computer-workspace /workspace ext4 discard,defaults,noatime,nofail 0 2' >> /etc/fstab && echo VOLUME_MONTADO > /var/lib/agent-computer-volume; else echo SEM_VOLUME > /var/lib/agent-computer-volume; fi" ]
  - [ bash, -c, "mkdir -p /workspace/browser /workspace/projects && chown -R agent:agent /workspace" ]

  # COFRE: estado cifrado no volume duravel, identidade no disco do SISTEMA.
  #
  # A separacao e o que torna a foto do volume inutil sozinha. `task snapshot`
  # copia /workspace para a conta do DigitalOcean; com a identidade aqui em
  # /etc, quem obtiver a foto leva so texto cifrado.
  #
  # Efeito colateral aceito: `update` reconstroi o disco do sistema e leva a
  # identidade junto. O cofre precisa ser reprovisionado depois -- e o mesmo
  # passo que ja existia para a chave da xAI, nao um passo novo.
  # O sudoers e VALIDADO no boot. Sem isto, um erro de sintaxe no drop-in faz o
  # sudo descartar o arquivo inteiro EM SILENCIO -- e o efeito nao e "a regra
  # nova nao vale", e sim "o agent perde todo o sudo", inclusive o da operacao.
  # Medido: uma continuacao de linha escrita com duas barras derrubou tudo, e o
  # sintoma foi "a password is required" num comando que nada tinha a ver.
  - [ bash, -c, "visudo -c -f /etc/sudoers.d/agent-computer || { echo SUDOERS_INVALIDO >&2; rm -f /etc/sudoers.d/agent-computer; exit 1; }" ]
  - [ bash, -c, "install -d -m 0700 -o agentd -g agentd /etc/agentd" ]
  # Senha do cofre gerada NA MAQUINA, nunca transportada. 48 bytes em base64
  # dao ~64 caracteres, bem acima do piso de 24 que o binario exige.
  - [ bash, -c, "test -s /etc/agentd/vault.pass || (umask 077 && openssl rand -base64 48 | tr -d '\n' > /etc/agentd/vault.pass); chown agentd:agentd /etc/agentd/vault.pass && chmod 600 /etc/agentd/vault.pass" ]
  # O diretorio de estado passa a ser do agentd, com o grupo agent podendo
  # trabalhar dentro. setgid (2770) faz todo arquivo novo herdar o grupo, senao
  # o que o modelo cria fica ilegivel para o servico -- e vice-versa.
  - [ bash, -c, "install -d -m 2750 -o agentd -g agent /workspace/agent && usermod -aG agent agentd" ]
  # TODO subdiretorio de estado e do agentd, com o agent apenas LENDO.
  #
  # Custou o teste da porta HTTP descobrir: `locks/` ficou do boot anterior como
  # `agent`, e o agentd -- que agora e outro usuario -- nao conseguia criar nem
  # abrir trava nenhuma. O supervisor le falha de trava como "tela ocupada",
  # entao TODA tela ficou permanentemente em 409, com o disco limpo. O sintoma
  # nao aponta para permissao em lugar nenhum.
  #
  # -R porque o volume e preservado no `update`: o que veio da versao anterior
  # chega com o dono antigo.
  - [ bash, -c, "install -d -m 2750 -o agentd -g agent /workspace/agent/locks /workspace/agent/status /workspace/agent/conversations /workspace/agent/screenshots" ]
  - [ bash, -c, "chown -R agentd:agent /workspace/agent/locks /workspace/agent/status /workspace/agent/conversations /workspace/agent/screenshots /workspace/agent/tasks /workspace/agent/events 2>/dev/null; true" ]
  # O cofre em si e 0700 do agentd: pertencer ao grupo da acesso ao TRABALHO,
  # nunca ao segredo. Esta linha e a que separa as duas coisas.
  - [ bash, -c, "install -d -m 0700 -o agentd -g agentd /workspace/agent/vault" ]
  # O AGENTE NAO REESCREVE AS PROPRIAS REGRAS.
  #
  # habilidades e conectores sao a instrucao e o alcance de rede do modelo. Sob
  # /workspace com escrita do grupo, ele editaria a propria habilidade e
  # cadastraria um conector apontando para onde quisesse -- inclusive para
  # 169.254.169.254, o metadata da nuvem. Passam a ser do agentd, com o agent
  # apenas LENDO. Quem instala e o operador, por `sudo -u agentd`.
  - [ bash, -c, "install -d -m 0755 -o agentd -g agentd /workspace/agent/skills /workspace/agent/connectors" ]
  # -R porque o volume e PRESERVADO no `update`: subdiretorios criados por uma
  # versao anterior chegam aqui com o dono antigo, e o `install -d` acima so
  # ajusta o diretorio de cima. O sintoma era o binario recusar a subir com
  # "chmod ... operation not permitted" -- mensagem que nao aponta para a causa.
  - [ bash, -c, "chown -R agentd:agentd /workspace/agent/skills /workspace/agent/connectors 2>/dev/null; chmod 0700 /workspace/agent/connectors/secrets 2>/dev/null; true" ]
  # A fila de avisos e o estado das tarefas o servico escreve; o modelo nao tem
  # o que fazer neles, e uma escrita ali forjaria evento e reabriria tela.
  - [ bash, -c, "install -d -m 0750 -o agentd -g agent /workspace/agent/tasks /workspace/agent/events" ]

  # DESCARTAVEL, explicitamente. A doc separa o que sobrevive do que nao:
  # temporarios, pacote instalado na mao e estado de aplicacao nao commitado
  # sao substituiveis. Sem um lugar declarado para o efemero, todo arquivo
  # acaba no /workspace e a fronteira deixa de existir na pratica.
  - [ bash, -c, "mkdir -p /scratch && chown agent:agent /scratch && chmod 1777 /scratch" ]
  - [ bash, -c, "printf 'D /scratch 1777 agent agent -\n' > /etc/tmpfiles.d/scratch.conf" ]

  # Google Chrome do repositorio oficial (nao Chromium): melhor compatibilidade
  # com site real, que e o ponto de um agente que navega na web de verdade.
  - [ bash, -c, "curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg" ]
  - [ bash, -c, "echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main' > /etc/apt/sources.list.d/google-chrome.list" ]
  - [ bash, -c, "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq google-chrome-stable" ]

  # Node 22 + Claude Code, para o agente rodar dentro da propria maquina.
  #
  # Ele mora no disco do SISTEMA, e nao no volume duravel -- de proposito. Todo
  # rebuild reinstala a versao corrente em vez de arrastar uma versao velha
  # presa no volume, que e o que aconteceria se ele morasse em /workspace. A
  # credencial, essa sim, fica no volume e volta sozinha.
  #
  # Sem pin de versao: o agente de codigo evolui rapido, e travar a versao aqui
  # significaria descobrir a defasagem so quando algo quebrasse.
  - [ bash, -c, "curl -fsSL https://deb.nodesource.com/setup_22.x | bash -" ]
  - [ bash, -c, "DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nodejs" ]

  # Retry, e marcador do resultado.
  #
  # `runcmd` NAO aborta quando um comando falha: um npm que morresse por rede ou
  # registry fora deixaria o droplet sem agente de codigo, com o cloud-init
  # reportando sucesso e a marca READY no lugar. A falha so apareceria na
  # primeira delegacao, como "o agente de codigo nao esta configurado" --
  # mensagem que manda procurar no lugar errado.
  #
  # O marcador e o que `task validate` le, na secao 10.
  - [ bash, -c, "for i in 1 2 3; do npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 && break; sleep 5; done; if command -v claude >/dev/null 2>&1; then claude --version > /var/lib/agent-computer-code-agent 2>&1; else echo FALHOU > /var/lib/agent-computer-code-agent; fi" ]

  # Tailscale instalado mas NAO autenticado: sem authkey no cofre, o login e
  # um clique do dono. Fica pronto para quando ele quiser a maquina na malha.
  - [ bash, -c, "curl -fsSL https://tailscale.com/install.sh | sh" ]

  # Firewall: so SSH. A tela e a porta de depuracao nunca saem da maquina.
  - [ bash, -c, "ufw default deny incoming && ufw default allow outgoing && ufw allow 22/tcp && ufw --force enable" ]

  # Subir a tela.
  - [ systemctl, daemon-reload ]
  # Tela 1 sobe sempre. Telas adicionais entram sob demanda com
  # `screen-add N`, seguindo o modelo da doc: uma maquina, N telas.
  - [ bash, -c, "systemctl enable --now xvfb@1 openbox@1 x11vnc@1 novnc@1 chrome@1" ]

  # Marca de conclusao lida pelo script de espera -- sem isso nao ha como
  # distinguir "cloud-init ainda rodando" de "cloud-init falhou".
  - [ bash, -c, "echo READY > /var/lib/agent-computer-ready" ]

final_message: "agent computer pronto em $UPTIME segundos"
