version: '3'

# `cmd | tee` devolve o codigo de saida do tee, que e sempre 0 — sem pipefail
# toda task passa verde mesmo com o script quebrado. Medido: o primeiro
# `task up` saiu rc=0 sem ter criado droplet nenhum.
set: [pipefail]

# O diretório de logs é ignorado pelo git, então um clone novo não o traz — e
# com pipefail ligado, o `tee` falhando derruba a task inteira. Criar aqui vale
# para todas elas, e evita o modo de falha em que o trabalho deu certo mas a
# task reporta erro.
run: once


# Agent computer — desktop virtual persistente no DigitalOcean.
# Todo comando registra saída em logs/, conforme a regra de logging do workspace.
#
# DOIS caminhos de sistema, escolhidos por AGENT_OS:
#
#   task up                    Ubuntu + cloud-init  (padrão, e o já verificado)
#   AGENT_OS=nixos task up     NixOS declarativo    (nixos/host.nix, via nixos-infect)
#
# O padrão continua Ubuntu de propósito: mantê-lo intacto é o que torna o NixOS
# uma escolha em vez de uma aposta. Voltar custa uma variável.

vars:
  LOG: '{{.TASK}}.log'

tasks:
  default:
    desc: Lista as tasks
    cmds: [task -l]

  check:
    desc: Confere binários, token, chave SSH e latência antes de gastar
    cmds:
      - mkdir -p logs
      - ./scripts/00-check-prereqs.sh 2>&1 | tee logs/check.log

  up:
    desc: Cria o droplet e espera o cloud-init terminar
    cmds:
      - mkdir -p logs
      - ./scripts/01-create.sh 2>&1 | tee logs/create.log
      - ./scripts/02-wait-ready.sh 2>&1 | tee logs/wait.log
      - ./scripts/03-status.sh 2>&1 | tee logs/status.log
      - ./scripts/08-validate.sh 2>&1 | tee logs/validate.log

  validate:
    desc: Validação ponta a ponta — units, portas, firewall, X, Chrome, noVNC, pixel
    cmds:
      - mkdir -p logs
      - ./scripts/08-validate.sh 2>&1 | tee logs/validate.log

  status:
    desc: Estado do droplet e dos serviços da tela
    cmds:
      - mkdir -p logs
      - ./scripts/03-status.sh 2>&1 | tee logs/status.log

  open:
    desc: Abre a tela do agente no navegador local, por túnel SSH
    cmds:
      - mkdir -p logs
      - ./scripts/06-open.sh 2>&1 | tee logs/open.log

  ssh:
    desc: Shell no droplet como usuário agent
    cmds:
      - |
        source ./scripts/lib.sh
        set +e
        load_token
        ip="$(droplet_ip)"
        [ -z "$ip" ] && { echo "droplet nao existe"; exit 1; }
        ssh -i "$SSH_KEY_FILE" -o StrictHostKeyChecking=accept-new "agent@${ip}"

  health:
    desc: Diagnostica computador inalcançável e diz qual recuperação usar
    cmds:
      - mkdir -p logs
      - ./scripts/14-health.sh 2>&1 | tee logs/health.log

  catalog:
    desc: 'Lista conectores e habilidades instalados. Uso: task catalog'
    cmds:
      - |
        source ./scripts/lib.sh
        set +e
        load_token
        agent_ssh '/usr/local/bin/agentd -catalog list'

  integration-test:
    desc: Teste integrado na máquina real — 12 seções, do estado durável ao take-over
    cmds:
      - mkdir -p logs
      - ./scripts/13-integration-test.sh 2>&1 | tee logs/integration.log

  vault:
    desc: 'Provisiona o cofre cifrado do droplet com os segredos do pass'
    cmds:
      - mkdir -p logs
      - ./scripts/26-setup-vault.sh 2>&1 | tee logs/vault.log

  serve-setup:
    desc: 'Instala as credenciais da porta HTTP: cofre e token da API'
    cmds:
      - mkdir -p logs
      - ./scripts/26-setup-vault.sh 2>&1 | tee logs/vault.log
      - ./scripts/23-setup-api-token.sh 2>&1 | tee logs/api-token.log

  nixos:validate:
    desc: 'Avalia a config NixOS no Mac, antes de gastar droplet — sintaxe, ASCII e sistema completo'
    cmds:
      - mkdir -p logs
      - ./scripts/30-nixos-validate.sh 2>&1 | tee logs/nixos-validate.log

  nixos:cloudinit:
    desc: 'Mostra o cloud-init do caminho NixOS, gerado a partir de nixos/'
    cmds:
      - ./scripts/29-nixos-cloudinit.sh

  test:cov:
    desc: 'Gate de cobertura: reprova abaixo de 90% em linha e branch, domínio 100%'
    dir: agent
    cmds:
      - ./scripts/coverage-gate.sh

  lint:
    desc: 'Gate dos scripts: variável órfã (sobra de renomeação) e uso da API sem load_token'
    cmds:
      - ./scripts/33-lint-scripts.sh 2>&1 | tee logs/lint.log

  functional:
    desc: 'Testes FUNCIONAIS: delegação, busca na web e o integrado — chamam o modelo de verdade'
    cmds:
      - mkdir -p logs
      - ./scripts/17-delegation-test.sh 2>&1 | tee logs/delegation-test.log
      - ./scripts/21-web-search-test.sh 2>&1 | tee logs/web-search-test.log
      - ./scripts/13-integration-test.sh 2>&1 | tee logs/integration.log

  guardrails-test:
    desc: 'Prova que os guardrails contêm: detector bloqueia, lição chega ao prompt, modelo não escreve'
    cmds:
      - mkdir -p logs
      - ./scripts/36-guardrails-test.sh 2>&1 | tee logs/guardrails-test.log

  redaction-test:
    desc: 'Prova que o segredo do conector some do histórico quando a API o devolve'
    cmds:
      - mkdir -p logs
      - ./scripts/37-redaction-test.sh 2>&1 | tee logs/redaction-test.log

  ssrf-test:
    desc: 'Prova que conector não alcança a rede interna — nem por NOME que resolve para lá'
    cmds:
      - mkdir -p logs
      - ./scripts/35-connector-ssrf-test.sh 2>&1 | tee logs/ssrf-test.log

  hostile:
    desc: 'Teste HOSTIL: entrada malformada, corpo gigante, auth sob ataque, degradação e concorrência'
    cmds:
      - mkdir -p logs
      - ./scripts/34-hostile-test.sh 2>&1 | tee logs/hostile.log

  e2e:
    desc: 'Teste ponta a ponta: as costuras entre as três suítes — cofre, delegação, catálogo, estado, contrato'
    cmds:
      - mkdir -p logs
      - ./scripts/32-end-to-end.sh 2>&1 | tee logs/e2e.log

  suites:
    desc: 'Roda as QUATRO suítes na máquina, em ordem, e falha se qualquer uma falhar'
    cmds:
      - mkdir -p logs
      - ./scripts/08-validate.sh 2>&1 | tee logs/validate.log
      - ./scripts/27-privilege-test.sh 2>&1 | tee logs/privilege-test.log
      - ./scripts/25-serve-integration-test.sh 2>&1 | tee logs/serve-test.log
      - ./scripts/32-end-to-end.sh 2>&1 | tee logs/e2e.log
      - ./scripts/35-connector-ssrf-test.sh 2>&1 | tee logs/ssrf-test.log
      - ./scripts/36-guardrails-test.sh 2>&1 | tee logs/guardrails-test.log

  privilege-test:
    desc: 'Prova adversarial: o modelo não alcança o cofre, não vira root, não troca o binário'
    cmds:
      - mkdir -p logs
      - ./scripts/27-privilege-test.sh 2>&1 | tee logs/privilege-test.log

  serve-test:
    desc: 'Teste da porta HTTP na máquina real: reconciliação após kill -9 e aviso com a sessão morta'
    cmds:
      - mkdir -p logs
      - ./scripts/25-serve-integration-test.sh 2>&1 | tee logs/serve-test.log

  serve-enable:
    desc: Sobe a porta HTTP e o timer de avisos, e os deixa ligados no boot
    cmds:
      - |
        source ./scripts/lib.sh
        set +e
        load_token
        agent_ssh 'sudo systemctl daemon-reload &&
          sudo systemctl enable --now agentd-api.service agentd-notify.timer &&
          sleep 2 &&
          systemctl is-active agentd-api.service &&
          timeout 10s curl -sS --max-time 5 http://127.0.0.1:8787/health' 2>&1 | tee logs/serve-enable.log

  serve-status:
    desc: Estado da porta HTTP e do timer de avisos
    cmds:
      - |
        source ./scripts/lib.sh
        set +e
        load_token
        agent_ssh 'systemctl is-active agentd-api.service agentd-notify.timer;
          echo; systemctl status agentd-api.service --no-pager -n 8;
          echo; timeout 10s curl -sS --max-time 5 http://127.0.0.1:8787/health || echo "(porta nao responde)"'

  serve-logs:
    desc: Log da porta HTTP
    cmds:
      - |
        source ./scripts/lib.sh
        set +e
        load_token
        agent_ssh 'journalctl -u agentd-api.service -n 60 --no-pager'

  deploy:
    desc: Compila o agentd e o instala em /workspace — o gate de cobertura roda antes
    cmds:
      - mkdir -p logs
      - ./scripts/16-deploy-agent.sh 2>&1 | tee logs/deploy-agent.log

  delegation-test:
    desc: 'Prova a delegação com a tarefa mista: Grok lê a web, Claude Code escreve o código'
    cmds:
      - mkdir -p logs
      - ./scripts/17-delegation-test.sh 2>&1 | tee logs/delegation-test.log

  web-search-test:
    desc: 'Prova a habilidade de busca com 4 perguntas reais: dólar, bitcoin, temperatura e jogos'
    cmds:
      - mkdir -p logs
      - ./scripts/21-web-search-test.sh 2>&1 | tee logs/web-search-test.log

  answers:
    desc: 'Mostra a RESPOSTA das últimas tarefas e as ferramentas usadas, não só o estado'
    cmds:
      - ./scripts/22-show-answers.sh {{.CLI_ARGS}}

  probe-web:
    desc: Sonda quais fontes da web respondem ao IP de datacenter do droplet
    cmds:
      - mkdir -p logs
      - ./scripts/18-probe-web-sources.sh 2>&1 | tee logs/probe-web.log

  persist-test:
    desc: Reinicia o droplet e prova que serviços e sessão do navegador sobrevivem
    cmds:
      - mkdir -p logs
      - ./scripts/09-persistence-test.sh 2>&1 | tee logs/persistence.log

  update:
    desc: 'Verbo UPDATE da doc: recria o computador com imagem nova, preservando /workspace'
    cmds:
      - mkdir -p logs
      - ./scripts/10-update.sh 2>&1 | tee logs/update.log

  reset:
    desc: 'Verbo RESET da doc: volta ao snapshot durável e DESCARTA trabalho recente'
    cmds:
      - mkdir -p logs
      - ./scripts/11-reset.sh {{.CLI_ARGS}} 2>&1 | tee logs/reset.log

  screens:
    desc: 'Lista as telas ativas. Para criar: task ssh, depois screen-add N'
    cmds:
      - |
        source ./scripts/lib.sh
        set +e
        load_token
        agent_ssh 'agent-status'

  examples:
    desc: 'Captura a saída REAL dos comandos que a doc promete (nenhum chama o modelo)'
    cmds:
      - mkdir -p logs
      - ./scripts/39-capture-examples.sh 2>&1 | tee logs/examples.log

  image-snapshot:
    desc: 'Fotografa o SISTEMA do droplet: a próxima criação pula os ~15 min de conversão'
    cmds:
      - mkdir -p logs
      - ./scripts/38-image-snapshot.sh 2>&1 | tee logs/image-snapshot.log

  snapshot:
    desc: Snapshot do volume durável (base do RESET)
    cmds:
      - mkdir -p logs
      - ./scripts/04-snapshot.sh 2>&1 | tee logs/snapshot.log

  restore:
    desc: 'Restaura de snapshot. Uso: task restore -- --latest'
    cmds:
      - mkdir -p logs
      - ./scripts/05-restore.sh {{.CLI_ARGS}} 2>&1 | tee logs/restore.log

  logs:
    desc: Log do cloud-init dentro do droplet (diagnóstico de boot)
    cmds:
      - |
        source ./scripts/lib.sh
        set +e
        load_token
        agent_ssh 'sudo cloud-init status --long; echo; sudo tail -60 /var/log/cloud-init-output.log' 2>&1 | tee logs/cloud-init.log

  restart:
    desc: Reinicia os serviços da tela (Xvfb, VNC, noVNC, Chrome)
    cmds:
      - |
        source ./scripts/lib.sh
        set +e
        load_token
        agent_ssh 'sudo systemctl restart xvfb openbox x11vnc novnc chrome && sleep 3 && agent-status' 2>&1 | tee logs/restart.log

  cost:
    desc: Custo corrente do droplet e dos snapshots
    cmds:
      - |
        source ./scripts/lib.sh
        set +e
        load_token
        echo "droplet $DROPLET_SIZE: US\$ 24,00/mes (US\$ 0,03571/h, cobranca por segundo)"
        echo
        echo "snapshots (US\$ 0,06/GB/mes):"
        doctl compute snapshot list --resource droplet --format Name,SizeGigaBytes 2>/dev/null | grep -E "Name|agent-computer" || echo "  nenhum"

  destroy:
    desc: Destrói o droplet (pede confirmação digitada)
    cmds:
      - mkdir -p logs
      - ./scripts/07-destroy.sh 2>&1 | tee logs/destroy.log
